name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}   # manual trigger from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23b06cff&color_dots=%23141122,%232a1a3d,%236b3fa0,%238f57d4,%23b06cff
            dist/github-contribution-grid-snake.svg?color_snake=%23ff5cc8&color_dots=%23ece6f5,%23d9b8ff,%23b06cff,%238f57d4,%236b3fa0

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

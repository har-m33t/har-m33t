name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}   # manual trigger from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffffff&color_dots=%2316161a,%232e2e36,%2370707d,%23b0b0bc,%23ffffff
            dist/github-contribution-grid-snake.svg?color_snake=%23c9c9d4&color_dots=%23f2f2f5,%23d8d8e0,%23ffffff,%23b0b0bc,%2370707d

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: refresh profile widgets

on:
  schedule:
    - cron: "0 6 * * *"   # once a day
  workflow_dispatch: {}   # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: true

jobs:
  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regenerates assets/stats.svg from live contribution data. The other
      # assets are static, but rebuilding them keeps the generator honest.
      - name: build widgets
        run: python3 .github/scripts/build_assets.py assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: commit refreshed widgets
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh profile widgets [skip ci]"
            git push
          else
            echo "no widget changes"
          fi

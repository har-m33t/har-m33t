<svg xmlns="http://www.w3.org/2000/svg" width="415" height="238" viewBox="0 0 415 238" role="img" aria-label="SIX EYES: one dashboard, six drones, zero blind spots"><defs></defs><rect width="415" height="238" fill="#09080f"/><rect x="0.5" y="0.5" width="414" height="237" fill="#120f1a" stroke="#1c1826"/><rect x="0" y="0" width="3" height="238" fill="#b06cff"/><text x="18" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#b06cff">SIX EYES</text><text x="18" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#857d99">one dashboard, six drones, zero blind spots</text><text x="18" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#ece6f5">Synchronized live video and telemetry from 6 concurrent UAVs</text><text x="18" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#ece6f5">over WebSockets, with search coverage auto-computed from</text><text x="18" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#ece6f5">operator-drawn map areas and split across the fleet.</text><rect x="18" y="142" width="88" height="20" fill="#b06cff"/><text x="26" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#09080f">4x less load</text><rect x="113.12" y="142" width="100" height="20" fill="#b06cff"/><text x="121.12" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#09080f">&lt;100ms latency</text><rect x="18" y="176" width="50" height="19" fill="none" stroke="#2b2440"/><text x="25" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#857d99">Python</text><rect x="74.06" y="176" width="56" height="19" fill="none" stroke="#2b2440"/><text x="81.06" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#857d99">YOLOv8n</text><rect x="136.13" y="176" width="74" height="19" fill="none" stroke="#2b2440"/><text x="143.13" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#857d99">WebSockets</text><rect x="216.23" y="176" width="44" height="19" fill="none" stroke="#2b2440"/><text x="223.23" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#857d99">React</text><text x="18" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#574f6b">$ git clone →</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="415" height="238" viewBox="0 0 415 238" role="img" aria-label="NIMBUS: real-time sign language → English, in the browser"><defs></defs><rect width="415" height="238" fill="#09080f"/><rect x="0.5" y="0.5" width="414" height="237" fill="#120f1a" stroke="#1c1826"/><rect x="0" y="0" width="3" height="238" fill="#b06cff"/><text x="18" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#b06cff">NIMBUS</text><text x="18" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#857d99">real-time sign language → English, in the browser</text><text x="18" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#ece6f5">An ONNX-compiled TGCN model parses 55 MediaPipe keypoints at</text><text x="18" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#ece6f5">30 FPS in a Web Worker, behind 9+ Lambdas and API Gateway</text><text x="18" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#ece6f5">WebSockets feeding Bedrock for live multi-user captioning.</text><rect x="18" y="142" width="88" height="20" fill="#b06cff"/><text x="26" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#09080f">800ms → 15ms</text><rect x="113.12" y="142" width="112" height="20" fill="#b06cff"/><text x="121.12" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#09080f">&lt;1.5s end-to-end</text><rect x="18" y="176" width="38" height="19" fill="none" stroke="#2b2440"/><text x="25" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#857d99">ONNX</text><rect x="62.04" y="176" width="68" height="19" fill="none" stroke="#2b2440"/><text x="69.03999999999999" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#857d99">MediaPipe</text><rect x="136.13" y="176" width="50" height="19" fill="none" stroke="#2b2440"/><text x="143.13" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#857d99">Lambda</text><rect x="192.19" y="176" width="56" height="19" fill="none" stroke="#2b2440"/><text x="199.19" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#857d99">Bedrock</text><text x="18" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#574f6b">$ git clone →</text></svg>
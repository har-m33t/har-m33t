<svg xmlns="http://www.w3.org/2000/svg" width="415" height="238" viewBox="0 0 415 238" role="img" aria-label="NIMBUS: real-time sign language → English, in the browser"><defs></defs><rect width="415" height="238" fill="#0a0908"/><rect x="0.5" y="0.5" width="414" height="237" fill="#120f0d" stroke="#1f1b16"/><rect x="0" y="0" width="3" height="238" fill="#ffb000"/><text x="18" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ffb000">NIMBUS</text><text x="18" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8073">real-time sign language → English, in the browser</text><text x="18" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#f5ede1">An ONNX-compiled TGCN model parses 55 MediaPipe keypoints at</text><text x="18" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#f5ede1">30 FPS in a Web Worker, behind 9+ Lambdas and API Gateway</text><text x="18" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#f5ede1">WebSockets feeding Bedrock for live multi-user captioning.</text><rect x="18" y="142" width="88" height="20" fill="#ffb000"/><text x="26" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0a0908">800ms → 15ms</text><rect x="113.12" y="142" width="112" height="20" fill="#ffb000"/><text x="121.12" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0a0908">&lt;1.5s end-to-end</text><rect x="18" y="176" width="38" height="19" fill="none" stroke="#2a231c"/><text x="25" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a8073">ONNX</text><rect x="62.04" y="176" width="68" height="19" fill="none" stroke="#2a231c"/><text x="69.03999999999999" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a8073">MediaPipe</text><rect x="136.13" y="176" width="50" height="19" fill="none" stroke="#2a231c"/><text x="143.13" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a8073">Lambda</text><rect x="192.19" y="176" width="56" height="19" fill="none" stroke="#2a231c"/><text x="199.19" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a8073">Bedrock</text><text x="18" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5c554a">$ git clone →</text></svg>
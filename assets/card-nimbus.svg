<svg xmlns="http://www.w3.org/2000/svg" width="415" height="238" viewBox="0 0 415 238" role="img" aria-label="NIMBUS: real-time sign language → English, in the browser"><defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14141a"/><stop offset="0.45" stop-color="#08080a"/><stop offset="1" stop-color="#101016"/></linearGradient><linearGradient id="accg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8b8c4"/></linearGradient><linearGradient id="barg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#5a5a66"/></linearGradient><linearGradient id="hotg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20202a"/><stop offset="1" stop-color="#101014"/></linearGradient></defs><rect width="415" height="238" fill="url(#bgg)"/><rect x="0.5" y="0.5" width="414" height="237" fill="#101014" stroke="#2a2a32"/><rect x="0" y="0" width="3" height="238" fill="url(#barg)"/><text x="18" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ffffff">NIMBUS</text><text x="18" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#a8a8b4">real-time sign language → English, in the browser</text><text x="18" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#f2f2f5">An ONNX-compiled TGCN model parses 55 MediaPipe keypoints at</text><text x="18" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#f2f2f5">30 FPS in a Web Worker, behind 9+ Lambdas and API Gateway</text><text x="18" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#f2f2f5">WebSockets feeding Bedrock for live multi-user captioning.</text><rect x="18" y="142" width="88" height="20" fill="url(#accg)"/><text x="26" y="156" font-family